  /trips/{tripId}/packing:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getPacking
      tags: [trips]
      summary: The trip's packing document (lists -> sections -> items).
      description: >
        Returns the whole `{ lists }`. BE seeds a Family list plus one per child
        profile (each with default sections) on first touch.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The packing collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchPacking
      tags: [trips]
      summary: Mutate packing (tick | add | delete | reset); returns the whole collection.
      description: >
        One collection endpoint. The body is a discriminated union on `action`;
        every mutation returns the full recomputed `{ lists }` so the client never
        merges or refetches. `reset` is trip-wide (clears every tick).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackingPatchRequest'
      responses:
        '200':
          description: The packing collection after the mutation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trips/{tripId}/grownups/checklist:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getGrownupsChecklist
      tags: [trips]
      summary: Persisted grown-ups checklist ticks.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Checklist tick state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateGrownupsChecklist
      tags: [trips]
      summary: Set checklist ticks (single item or a batch).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistUpdateRequest'
      responses:
        '200':
          description: The checklist after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT. The database reads the JWT to enforce RLS.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase JWT with role=admin and AAL2 (verified MFA). The server rejects
        non-admin or non-MFA callers with 403. Every call is audited.
    mcpAuth:
      type: http
      scheme: bearer
      description: >
        A scoped BYO-AI connector token from POST /connectors/byo-ai. Not a
        Supabase JWT; carries the trip scope and is checked against the connector
        row on every call.

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
      description: Trip identifier.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a prior response's nextCursor.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
      description: Page size.

  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests, or the per-trip daily AI cap is reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EntitlementRequired:
      description: The trip's tier does not entitle the caller to this AI surface.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not an admin, or MFA (AAL2) not satisfied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemNotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemBadRequest:
      description: The request could not be processed (e.g. duplicate price id).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemUnprocessable:
      description: A field failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable description.
            details:
              type: array
              items:
                type: string

    Tier:
      type: string
      enum: [free, byo, ours]
      description: How the trip was bought; drives entitlement and AI path.

    TripStatus:
      type: string
      enum: [draft, planning, ready, holidaying, complete, archived]

    ExplorerMode:
      type: string
      enum: [little, standard, explorer, explorer_plus]
      description: 'Voice/age band. Child: little|explorer|explorer_plus; standard = parent/carer voice.'

    ProfileType:
      type: string
      enum: [child, parent_carer]
      description: Who the profile belongs to (child → Explorers; parent_carer → Grown-ups, PIN-gated).

    ChildProfile:
      type: object
      additionalProperties: false
      required: [id, name, type, pin_set, interests, dietary, medical, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: string, nullable: true }
        age: { type: integer, nullable: true }
        mode:
          oneOf: [{ $ref: '#/components/schemas/ExplorerMode' }, { type: 'null' }]
        type: { $ref: '#/components/schemas/ProfileType' }
        pin_set:
          type: boolean
          description: Whether a parent/carer PIN is configured (read-only; the PIN is never returned).
        interests: { type: array, items: { type: string } }
        dietary:
          type: array
          items: { type: string }
          description: Dietary flags surfaced to adults as content safety notes.
        medical:
          type: array
          items: { type: string }
          description: Medical flags surfaced to adults as content safety callouts.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChildProfileInput:
      type: object
      additionalProperties: false
      description: Create (name required) or update (all optional) a profile.
      properties:
        name: { type: string }
        avatar: { type: string, nullable: true }
        age: { type: integer, nullable: true, minimum: 0, maximum: 18 }
        mode:
          oneOf: [{ $ref: '#/components/schemas/ExplorerMode' }, { type: 'null' }]
        type: { $ref: '#/components/schemas/ProfileType' }
        interests: { type: array, items: { type: string } }
        dietary: { type: array, items: { type: string } }
        medical: { type: array, items: { type: string } }

    PinRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin: { type: string, description: A 4-digit PIN. }

    PinVerifyResponse:
      type: object
      additionalProperties: false
      required: [verified, attempts_remaining, locked_until]
      properties:
        verified: { type: boolean }
        attempts_remaining:
          type: integer
          description: Attempts left before lockout; 0 when locked (or on the attempt that locks).
        locked_until:
          type: string
          nullable: true
          description: ISO timestamp when the lock lifts, or null when not locked.

    TripProgress:
      type: object
      additionalProperties: false
      required: [profile_id, done_items, updated_at]
      properties:
        profile_id:
          type: string
          nullable: true
          description: The child this progress belongs to.
        active_mode:
          oneOf: [{ $ref: '#/components/schemas/ExplorerMode' }, { type: 'null' }]
        done_items:
          type: array
          items: { type: string }
          description: Ids of content items (activities, challenges) marked done.
        updated_at: { type: string, format: date-time }

    ProgressUpdateRequest:
      type: object
      additionalProperties: false
      required: [profile_id]
      properties:
        profile_id: { type: string }
        active_mode:
          $ref: '#/components/schemas/ExplorerMode'
        done_items:
          type: array
          items: { type: string }
          description: Full replacement of the done set.
        mark_done:
          type: array
          items: { type: string }
          description: 'Incremental: add these item ids to the done set.'
        mark_undone:
          type: array
          items: { type: string }
          description: 'Incremental: remove these item ids from the done set.'

    StarLedgerEntry:
      type: object
      additionalProperties: false
      required: [id, profile_id, source, day, stars, created_at]
      properties:
        id: { type: string }
        profile_id: { type: string }
        source:
          type: string
          description: 'What earned the stars, e.g. challenge:<id>, star_challenge, game:<id>.'
        day:
          type: string
          description: Per-day scoping ('' when not day-specific).
        stars: { type: integer }
        created_at: { type: string, format: date-time }

    StarBalance:
      type: object
      additionalProperties: false
      required: [profile_id, stars]
      properties:
        profile_id: { type: string }
        stars: { type: integer }

    StarsResponse:
      type: object
      additionalProperties: false
      required: [balances, entries]
      properties:
        balances:
          type: array
          items: { $ref: '#/components/schemas/StarBalance' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/StarLedgerEntry' }

    StarClaimRequest:
      type: object
      additionalProperties: false
      required: [profile_id, source]
      properties:
        profile_id: { type: string }
        source: { type: string }
        day: { type: string, description: Per-day scoping; omit for a non-day achievement. }
        stars: { type: integer, minimum: 1, maximum: 10, description: Defaults to 1. }

    StarClaimResponse:
      type: object
      additionalProperties: false
      required: [claimed, entry, balance]
      properties:
        claimed:
          type: boolean
          description: False when already claimed (idempotent no-op).
        entry:
          $ref: '#/components/schemas/StarLedgerEntry'
        balance:
          type: integer
          description: The child's new total.

    PackingItem:
      type: object
      additionalProperties: false
      required: [id, label, checked]
      properties:
        id: { type: string }
        label: { type: string }
        qty: { type: integer, minimum: 1 }
        checked: { type: boolean }

    PackingSection:
      type: object
      additionalProperties: false
      required: [id, label, items]
      properties:
        id: { type: string }
        label: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PackingItem' }

    PackingList:
      type: object
      additionalProperties: false
      required: [id, label, sections]
      properties:
        id:
          type: string
          description: A child profile id, or the literal "family".
        label: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/PackingSection' }

    PackingResponse:
      type: object
      additionalProperties: false
      required: [lists]
      properties:
        lists:
          type: array
          items: { $ref: '#/components/schemas/PackingList' }

    PackingPatchRequest:
      description: Discriminated union on `action`; response is always PackingResponse.
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, list_id, item_id, checked]
          properties:
            action: { type: string, enum: [tick] }
            list_id: { type: string }
            item_id: { type: string }
            checked: { type: boolean }
        - type: object
          additionalProperties: false
          required: [action, list_id, section_id, label]
          properties:
            action: { type: string, enum: [add] }
            list_id: { type: string }
            section_id: { type: string }
            label: { type: string }
            qty: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [action, list_id, item_id]
          properties:
            action: { type: string, enum: [delete] }
            list_id: { type: string }
            item_id: { type: string }
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { type: string, enum: [reset] }

    ChecklistItem:
      type: object
      additionalProperties: false
      required: [item, checked, updated_at]
      properties:
        item: { type: string }
        checked: { type: boolean }
        updated_at: { type: string, format: date-time }

    ChecklistResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }

    ChecklistUpdateRequest:
      type: object
      additionalProperties: false
      description: A single { item, checked } or a batch via items.
      properties:
        item: { type: string }
        checked: { type: boolean }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, checked]
            properties:
              item: { type: string }
              checked: { type: boolean }

    Trip:
      type: object
      additionalProperties: false
      required: [id, destination, tier, status]
      properties:
        id:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string
        tier:
          $ref: '#/components/schemas/Tier'
        status:
          $ref: '#/components/schemas/TripStatus'
        retention_expires_at:
          type: string
          format: date-time
          description: When trip data is scheduled for disposal unless a keep-token extends it.
        created_at:
          type: string
          format: date-time

    TripSummary:
      type: object
      additionalProperties: false
      description: >
        List view of a trip. The stored trip columns plus two derived fields the
        FE list needs: day_count and data_kept.
      required: [id, destination, tier, status, day_count, data_kept]
      properties:
        id:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string
        tier:
          $ref: '#/components/schemas/Tier'
        status:
          $ref: '#/components/schemas/TripStatus'
        retention_expires_at:
          type: string
          format: date-time
        day_count:
          type: integer
          minimum: 0
          description: Number of days currently planned in the trip content.
        data_kept:
          type: boolean
          description: False once the trip is past its retention/disposal date.
        created_at:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string

    DemoChildProfile:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
          minimum: 0
          maximum: 18
        mode:
          type: string
          enum: [little, standard, explorer, explorer_plus]
          description: Kid explorer mode used to pick the variant block.
        interests:
          type: array
          items:
            type: string
        dietary:
          type: array
          items:
            type: string
          description: Dietary flags surfaced to adults as safety notes.
        medical:
          type: array
          items:
            type: string
          description: Medical flags surfaced to adults as safety callouts.

    DemoGenerateDayRequest:
      type: object
      additionalProperties: false
      required: [destination, child]
      properties:
        destination:
          type: string
          minLength: 1
        date:
          type: string
          format: date
          description: Optional day to theme the plan around.
        child:
          $ref: '#/components/schemas/DemoChildProfile'

    DemoGenerateDayResponse:
      type: object
      additionalProperties: false
      required: [day, grownups_teaser]
      properties:
        day:
          $ref: '#/components/schemas/Day'
        grownups_teaser:
          type: string
          description: A short teaser of the grown-ups guide.
        generated_by:
          type: string
          enum: [ai, fallback]
          description: Whether a live model produced this or the deterministic fallback did.

    SignupCaptureRequest:
      type: object
      additionalProperties: false
      required: [email, consent]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        source:
          type: string
          description: Funnel source, e.g. website-demo or fe-demo.
        consent:
          type: boolean
          description: Marketing consent state captured at signup.
        attributes:
          type: object
          additionalProperties: true
          description: Optional free-form attributes synced to Brevo.

    SignupCaptureResponse:
      type: object
      additionalProperties: false
      required: [contact_id, status]
      properties:
        contact_id:
          type: string
        status:
          type: string
          enum: [created, updated]
        synced_to_brevo:
          type: boolean

    TwoFactorVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 10

    TwoFactorVerifyResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean

    # ----- Canonical content model (mirrors schemas/trip-content.schema.json) -----
    TripContent:
      type: object
      additionalProperties: false
      required: [trip, days]
      properties:
        trip:
          $ref: '#/components/schemas/TripContentHeader'
        days:
          type: array
          items:
            $ref: '#/components/schemas/Day'
        grownups:
          $ref: '#/components/schemas/Grownups'

    TripContentHeader:
      type: object
      additionalProperties: false
      required: [id, destination, start_date, end_date]
      properties:
        id:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string

    Day:
      type: object
      additionalProperties: false
      required: [id, moments]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        label:
          type: string
        summary:
          type: string
        did_you_know:
          type: string
        weather:
          $ref: '#/components/schemas/Weather'
        hotel:
          $ref: '#/components/schemas/Hotel'
        game:
          $ref: '#/components/schemas/Game'
        star_challenge:
          $ref: '#/components/schemas/StarChallenge'
        moments:
          type: array
          items:
            $ref: '#/components/schemas/Moment'

    Weather:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string }
        high: { type: number }
        low: { type: number }
        icon: { type: string }

    Hotel:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        phase: { type: string, enum: [arrive, stay, depart, move] }
        checkin: { type: string }
        checkout: { type: string }
        note: { type: string }

    Game:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [tap_collect, colouring, spot_it] }
        title: { type: string }
        stars: { type: integer }
        config: { type: object, additionalProperties: true }

    StarChallenge:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string }
        prompt: { type: string }
        stars: { type: integer }

    Moment:
      type: object
      additionalProperties: false
      required: [id, slot, title, activities]
      properties:
        id:
          type: string
        slot:
          type: string
          enum: [morning, midday, afternoon, evening, night, anytime]
        title:
          type: string
        time_hint:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'

    Location:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        zoom:
          type: number

    Activity:
      type: object
      additionalProperties: false
      required: [id, kind, title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [kid, shared, adult]
        title:
          type: string
        body:
          type: string
        variants:
          $ref: '#/components/schemas/Variants'
        booking:
          $ref: '#/components/schemas/Booking'
        safety:
          $ref: '#/components/schemas/Safety'
        media_ref:
          type: array
          items:
            type: string
        facts:
          type: array
          items:
            type: string
        challenge:
          $ref: '#/components/schemas/Challenge'

    Challenge:
      type: object
      additionalProperties: false
      required: [type, prompt]
      properties:
        type: { type: string, enum: [quiz, spot, photo, challenge] }
        prompt: { type: string }
        answer: { type: string }
        options:
          type: array
          items: { type: string }
        stars: { type: integer }

    Variants:
      type: object
      additionalProperties: false
      properties:
        little:
          $ref: '#/components/schemas/VariantBlock'
        standard:
          $ref: '#/components/schemas/VariantBlock'
        explorer:
          $ref: '#/components/schemas/VariantBlock'
        explorer_plus:
          $ref: '#/components/schemas/VariantBlock'

    VariantBlock:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
        fact:
          type: string
        quiz:
          $ref: '#/components/schemas/Quiz'

    Quiz:
      type: object
      additionalProperties: false
      required: [q, a]
      properties:
        q:
          type: string
        a:
          type: string
        options:
          type: array
          items:
            type: string

    Booking:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        time:
          type: string
        ref:
          type: string
        notes:
          type: string

    Safety:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
        flags:
          type: array
          items:
            type: string

    Grownups:
      type: object
      additionalProperties: false
      properties:
        essentials:
          type: string
        checklist:
          type: array
          items:
            type: string
        transport:
          type: string

    # ===== Use-our-AI schemas (v0.3) =====

    ActivityPatch:
      type: object
      additionalProperties: false
      description: A partial Activity for update_activity (id is immutable).
      properties:
        kind:
          type: string
          enum: [kid, shared, adult]
        title:
          type: string
        body:
          type: string
        variants:
          $ref: '#/components/schemas/Variants'
        booking:
          $ref: '#/components/schemas/Booking'
        safety:
          $ref: '#/components/schemas/Safety'
        media_ref:
          type: array
          items:
            type: string

    PatchOp:
      description: A single structured edit to the trip content.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, day]
          properties:
            op: { const: add_day }
            day: { $ref: '#/components/schemas/Day' }
        - type: object
          additionalProperties: false
          required: [op, day_id, summary]
          properties:
            op: { const: set_day_summary }
            day_id: { type: string }
            summary: { type: string }
        - type: object
          additionalProperties: false
          required: [op, day_id, moment]
          properties:
            op: { const: add_moment }
            day_id: { type: string }
            moment: { $ref: '#/components/schemas/Moment' }
        - type: object
          additionalProperties: false
          required: [op, day_id, moment_id, activity]
          properties:
            op: { const: add_activity }
            day_id: { type: string }
            moment_id: { type: string }
            activity: { $ref: '#/components/schemas/Activity' }
        - type: object
          additionalProperties: false
          required: [op, activity_id, set]
          properties:
            op: { const: update_activity }
            activity_id: { type: string }
            set: { $ref: '#/components/schemas/ActivityPatch' }
        - type: object
          additionalProperties: false
          required: [op, activity_id, to_moment_id]
          properties:
            op: { const: move_activity }
            activity_id: { type: string }
            to_moment_id: { type: string }
        - type: object
          additionalProperties: false
          required: [op, activity_id, booking]
          properties:
            op: { const: set_booking }
            activity_id: { type: string }
            booking: { $ref: '#/components/schemas/Booking' }

    TripContentPatch:
      type: object
      additionalProperties: false
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PatchOp'
        note:
          type: string
          description: Short human-readable note on what changed.

    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    PlanChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'

    PlanChatEvent:
      description: >
        One frame of the chat SSE stream (the JSON in a `data:` line). The stream
        also emits a literal `data: [DONE]` terminator.
      oneOf:
        - type: object
          additionalProperties: false
          required: [start, generated_by]
          properties:
            start: { const: true }
            generated_by: { type: string, enum: [ai, fallback] }
        - type: object
          additionalProperties: false
          required: [delta]
          properties:
            delta: { type: string }
        - type: object
          additionalProperties: false
          required: [done]
          properties:
            done: { const: true }
            job_id: { type: [string, 'null'] }
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error: { type: string }

    IngestImage:
      type: object
      additionalProperties: false
      required: [media_type, data]
      properties:
        media_type:
          type: string
          description: e.g. image/jpeg, image/png.
        data:
          type: string
          description: 'base64-encoded image bytes (no data: prefix).'

    IngestRequest:
      type: object
      additionalProperties: false
      description: Provide text, image, or both.
      properties:
        text:
          type: string
        image:
          $ref: '#/components/schemas/IngestImage'
        hint:
          type: object
          additionalProperties: false
          properties:
            day_id: { type: string }
            moment_id: { type: string }

    IngestResponse:
      type: object
      additionalProperties: false
      required: [applied, job_id, generated_by, patch, content]
      properties:
        applied:
          type: boolean
        job_id:
          type: [string, 'null']
          description: The ai_jobs ledger id (counts to the daily cap).
        generated_by:
          type: string
          enum: [ai, fallback]
        patch:
          $ref: '#/components/schemas/TripContentPatch'
        content:
          $ref: '#/components/schemas/TripContent'

    # ===== Journal + media schemas (v0.6) =====

    JournalEntry:
      type: object
      additionalProperties: false
      required: [id, trip_id, body, media_ref, created_at]
      properties:
        id: { type: string }
        trip_id: { type: string }
        profile_id: { type: [string, 'null'] }
        day_id:
          type: [string, 'null']
          description: Content day this entry is scoped to (TripContent.days[].id); null = trip-level.
        body: { type: string }
        mood:
          type: [string, 'null']
          description: Short mood label the FE maps to its mood picker.
        stars:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: A 1-5 star rating of the day/moment.
        media_ref:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    JournalEntryInput:
      type: object
      additionalProperties: false
      properties:
        body: { type: string }
        profile_id: { type: string }
        day_id: { type: string, description: 'Content day this entry is scoped to (e.g. d_2).' }
        mood: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        media_ref:
          type: array
          items: { type: string }

    JournalListResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/JournalEntry' }

    SignUploadRequest:
      type: object
      additionalProperties: false
      required: [trip_id]
      properties:
        trip_id: { type: string }
        content_type: { type: string }

    SignUploadResponse:
      type: object
      additionalProperties: false
      required: [media_ref, path, upload_url, token]
      properties:
        media_ref: { type: string }
        path: { type: string }
        upload_url: { type: string }
        token: { type: string }

    # ===== Account schemas (v0.17) =====

    AccountSummary:
      type: object
      additionalProperties: false
      required: [email, recoveryEmail, role, twoFactorEnrolled, deletionRequestedAt, createdAt]
      properties:
        email: { type: string, format: email }
        recoveryEmail: { type: [string, 'null'], format: email }
        role:
          type: string
          enum: [user, admin]
        twoFactorEnrolled: { type: boolean }
        deletionRequestedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        recoveryEmail:
          type: [string, 'null']
          format: email
          description: New recovery email, or null to clear it.

    # ===== BYO-AI MCP schemas (v0.6) =====

    ConnectorStatus:
      type: string
      enum: [active, revoked]

    Connector:
      type: object
      additionalProperties: false
      required: [id, trip_id, scopes, status, created_at]
      properties:
        id: { type: string }
        trip_id: { type: string }
        label: { type: [string, 'null'] }
        scopes:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/ConnectorStatus' }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ConnectorsListResponse:
      type: object
      additionalProperties: false
      required: [connectors]
      properties:
        connectors:
          type: array
          items: { $ref: '#/components/schemas/Connector' }

    ByoConnectorRequest:
      type: object
      additionalProperties: false
      required: [trip_id]
      properties:
        trip_id: { type: string }
        label: { type: string }

    ByoConnectorResponse:
      type: object
      additionalProperties: false
      required: [connector_id, token, mcp_url]
      properties:
        connector_id: { type: string }
        token: { type: string }
        mcp_url: { type: string }

    # ===== Admin-scoped schemas (v0.2) =====
    Problem:
      type: object
      description: RFC 9457 problem+json.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    AiModel:
      type: string
      enum: [claude-sonnet, claude-opus, gemini, openai]

    AiJobKind:
      type: string
      enum: [generation, ingestion, chat]

    AiJobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    Role:
      type: string
      enum: [user, admin]

    AdminSession:
      type: object
      additionalProperties: false
      required: [userId, role, mfaVerified]
      properties:
        userId: { type: string }
        email: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        mfaVerified: { type: boolean }

    AdminAccount:
      type: object
      additionalProperties: false
      required: [userId, email, role]
      properties:
        userId: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }

    AdminPromoteRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Prompt:
      type: object
      additionalProperties: false
      required: [id, task, title, body, model, version, active, updatedAt, updatedBy]
      properties:
        id: { type: string }
        task: { type: string }
        title: { type: string }
        body: { type: string }
        model: { $ref: '#/components/schemas/AiModel' }
        version: { type: integer }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    CreatePromptRequest:
      type: object
      additionalProperties: false
      required: [task, title, body, model]
      properties:
        task: { type: string }
        title: { type: string }
        body: { type: string }
        model: { $ref: '#/components/schemas/AiModel' }

    CreatePromptVersionRequest:
      type: object
      additionalProperties: false
      required: [title, body, model]
      properties:
        title: { type: string }
        body: { type: string }
        model: { $ref: '#/components/schemas/AiModel' }

    ModelRoute:
      type: object
      additionalProperties: false
      required: [task, defaultModel]
      properties:
        task: { type: string }
        defaultModel: { $ref: '#/components/schemas/AiModel' }
        override: { $ref: '#/components/schemas/AiModel' }

    SetModelRouteRequest:
      type: object
      additionalProperties: false
      required: [defaultModel]
      properties:
        defaultModel: { $ref: '#/components/schemas/AiModel' }
        override:
          oneOf:
            - { $ref: '#/components/schemas/AiModel' }
            - { type: 'null' }

    AiJob:
      type: object
      additionalProperties: false
      required: [id, tripId, kind, status, model, promptVersion, createdAt]
      properties:
        id: { type: string }
        tripId: { type: string }
        kind: { $ref: '#/components/schemas/AiJobKind' }
        status: { $ref: '#/components/schemas/AiJobStatus' }
        model: { $ref: '#/components/schemas/AiModel' }
        promptVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        error: { type: string }

    JobCapUsage:
      type: object
      additionalProperties: false
      required: [tripId, date, used, limit, remaining]
      properties:
        tripId: { type: string }
        date: { type: string, format: date }
        used: { type: integer }
        limit: { type: integer }
        remaining: { type: integer }

    AdminTripSummary:
      type: object
      additionalProperties: false
      required: [id, destination, ownerEmail, tier, status, startDate, endDate, retentionExpiresAt]
      properties:
        id: { type: string }
        destination: { type: string }
        ownerEmail: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        status: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        retentionExpiresAt:
          type: [string, 'null']
          format: date-time

    AdminChildProfile:
      type: object
      additionalProperties: false
      required: [id, name, type, pin_set, interests]
      properties:
        id: { type: string }
        name: { type: string }
        age: { type: integer }
        mode:
          type: string
          enum: [little, standard, explorer, explorer_plus]
        type: { $ref: '#/components/schemas/ProfileType' }
        pin_set:
          type: boolean
          description: Whether a parent/carer PIN is configured (read-only; the PIN is never returned).
        interests:
          type: array
          items: { type: string }
        medical:
          type: array
          items: { type: string }

    AdminProgress:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId: { type: [string, 'null'] }
        activeMode:
          type: [string, 'null']
        doneItems:
          type: array
          items: { type: string }

    CustomerSummary:
      type: object
      additionalProperties: false
      required: [userId, email, tier, retentionExpiresAt, deletionRequested]
      properties:
        userId: { type: string }
        email: { type: string }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/Tier' }
            - { type: 'null' }
        retentionExpiresAt:
          type: [string, 'null']
          format: date-time
        deletionRequested: { type: boolean }

    ProductKind:
      type: string
      enum: [tier, keep]
      description: >
        What a product confers on purchase: `tier` grants a trip entitlement;
        `keep` is a keep-token that extends a trip's data retention.

    ProductSummary:
      type: object
      additionalProperties: false
      required: [priceId, name, amountUsd, kind, active]
      properties:
        priceId: { type: string }
        name: { type: string }
        amountUsd: { type: number }
        kind:
          $ref: '#/components/schemas/ProductKind'
        tier:
          $ref: '#/components/schemas/Tier'
        extendsMonths:
          type: integer
          nullable: true
          description: 'For `kind: keep`, months of retention a purchase adds.'
        active: { type: boolean }
        livemode:
          type: boolean
          description: Stripe mode (true = live, false = test). Catalogue is scoped to the deployment's mode.

    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [priceId, name, amountUsd]
      properties:
        priceId:
          type: string
          description: The Stripe price id this catalogue row maps to.
        name: { type: string }
        amountUsd: { type: number }
        kind:
          $ref: '#/components/schemas/ProductKind'
        tier:
          $ref: '#/components/schemas/Tier'
        extendsMonths:
          type: integer
          minimum: 1
          description: 'Required for `kind: keep`; months of retention a purchase adds.'
        active: { type: boolean, default: true }

    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        amountUsd: { type: number }
        kind:
          $ref: '#/components/schemas/ProductKind'
        tier:
          allOf: [{ $ref: '#/components/schemas/Tier' }]
          nullable: true
        extendsMonths:
          type: integer
          minimum: 1
          nullable: true
        active: { type: boolean }

    CheckoutSessionRequest:
      type: object
      additionalProperties: false
      required: [price_id]
      properties:
        price_id:
          type: string
          description: Stripe price id of a known, active catalogue product.
        trip_id:
          type: string
          description: Optional trip the purchased tier applies to.
        code:
          type: string
          description: Optional affiliate discount/attribution code (from /go/<slug>).
        success_url:
          type: string
        cancel_url:
          type: string

    CheckoutSessionResponse:
      type: object
      additionalProperties: false
      required: [url, session_id]
      properties:
        url:
          type: string
          description: Stripe-hosted Checkout URL to redirect the customer to.
        session_id:
          type: string

    PurchaseSummary:
      type: object
      additionalProperties: false
      required: [id, ownerEmail, priceId, tier, amountUsd, createdAt]
      properties:
        id: { type: string }
        ownerEmail: { type: string }
        priceId: { type: string }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/Tier' }
            - { type: 'null' }
        amountUsd: { type: number }
        discountCode: { type: [string, 'null'] }
        discountUsd: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }

    Affiliate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          email,
          handle,
          code,
          discountPercent,
          commissionPercent,
          landingSlug,
          status,
          createdAt,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        handle: { type: string }
        code: { type: string }
        discountPercent: { type: integer }
        commissionPercent: { type: integer }
        landingSlug: { type: string }
        status: { $ref: '#/components/schemas/AffiliateStatus' }
        createdAt: { type: string, format: date-time }

    AffiliateStatus:
      type: string
      enum: [active, paused]

    CreateAffiliateInput:
      type: object
      additionalProperties: false
      required: [name, email, handle, discountPercent, commissionPercent]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        handle: { type: string }
        discountPercent: { type: integer, minimum: 0, maximum: 100 }
        commissionPercent: { type: integer, minimum: 0, maximum: 100 }
        code: { type: string, description: Hint; BE owns uniqueness (409 on collision). }
        landingSlug: { type: string, description: Hint; BE owns uniqueness. }

    AffiliateRedemption:
      type: object
      additionalProperties: false
      required: [purchaseId, ownerEmail, priceId, grossUsd, discountUsd, netUsd, createdAt]
      properties:
        purchaseId: { type: string }
        ownerEmail: { type: string }
        priceId: { type: string }
        grossUsd: { type: number }
        discountUsd: { type: number }
        netUsd: { type: number }
        createdAt: { type: string, format: date-time }

    AffiliatePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Affiliate' }
        nextCursor: { type: [string, 'null'] }

    AffiliateRedemptionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AffiliateRedemption' }
        nextCursor: { type: [string, 'null'] }

    AffiliateReportRequest:
      type: object
      additionalProperties: false
      required: [periodStart, periodEnd]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }

    ContentReviewItem:
      type: object
      additionalProperties: false
      required: [tripId, destination, status, generatedAt, reviewedAt, reviewedBy]
      properties:
        tripId: { type: string }
        destination: { type: string }
        status:
          type: string
          enum: [pending, approved, edited]
        generatedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'] }

    # ----- Pagination envelopes -----
    PromptPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Prompt' }
        nextCursor: { type: [string, 'null'] }

    AiJobPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiJob' }
        nextCursor: { type: [string, 'null'] }

    TripSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminTripSummary' }
        nextCursor: { type: [string, 'null'] }

    CustomerSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSummary' }
        nextCursor: { type: [string, 'null'] }

    ContentReviewPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentReviewItem' }
        nextCursor: { type: [string, 'null'] }

    PurchaseSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseSummary' }
        nextCursor: { type: [string, 'null'] }
