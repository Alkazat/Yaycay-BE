    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: verifyProfilePin
      tags: [trips]
      summary: Verify the parent/carer PIN (unlock Grown-ups for the session).
      description: >
        Returns `{ verified, attempts_remaining, locked_until }` (always `200`). A
        wrong PIN is `verified: false` and counts toward the attempt cap;
        `attempts_remaining` reaches `0` and `locked_until` is set once the cap is
        hit, and stays set until the lock window passes. 422 if no PIN is set.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
