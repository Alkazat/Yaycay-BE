openapi: 3.1.0
info:
  title: Yaycay API
  version: 0.3.0
  description: >
    Yaycay back-end HTTP API. The v0.1 surface (Phase 0) is the free-demo
    generator, signup/lead capture, the 2FA verify step, and trip + trip-content
    read/mutate. v0.2 adds the admin-scoped `/admin/*` surface (prompts, models,
    jobs, trips/customers, content review, commerce). v0.3 adds the use-our-AI
    surfaces: a streaming planning chat and structured ingestion (a receipt,
    booking, or note becomes a validated patch on the trip content). BE owns this
    contract; FE, Admin and Website are clients and never call an endpoint or
    read a field that is not defined here.
  contact:
    name: Yaycay Back-End
    url: https://github.com/Alkazat/Yaycay-BE
servers:
  - url: https://api.yaycay.ai
    description: Production
  - url: https://staging.api.yaycay.ai
    description: Staging
tags:
  - name: demo
    description: Free-demo hook (public, rate-limited).
  - name: signup
    description: Lead capture and Brevo sync.
  - name: auth
    description: Authentication helpers (2FA on every sign-in).
  - name: trips
    description: Trip CRUD and the canonical trip content payload.
  - name: admin
    description: >
      Admin-scoped, off-domain surface. Every endpoint requires a Supabase JWT
      with role=admin and AAL2 (verified MFA); non-admin or non-MFA callers get
      403. Every call is audited server-side. Errors are RFC 9457 problem+json.

paths:
  /demo/generate-day:
    post:
      operationId: generateDemoDay
      tags: [demo]
      summary: Generate one AI-built day for the free demo.
      description: >
        The hook. Produces a single day for one person with one quiz and a teaser
        of the grown-ups guide. The single AI action is never advertised; it is
        just how the demo generates. Public and rate-limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoGenerateDayRequest'
      responses:
        '200':
          description: A generated demo day plus a grown-ups teaser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoGenerateDayResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /signup/capture:
    post:
      operationId: captureSignup
      tags: [signup]
      summary: Create or update a lead and sync to Brevo.
      description: >
        Used by the Website funnel and the FE demo. Upserts a marketing_contacts
        row with consent state and syncs to Brevo. Idempotent on email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCaptureRequest'
      responses:
        '200':
          description: Lead captured (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCaptureResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      tags: [auth]
      summary: Verify the one-time email 2FA code.
      description: >
        Second factor required on every sign-in. Verifies the one-time code sent
        to the account email; on success the session is fully established.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: Code verified; session elevated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List the caller's trips.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's trips (RLS scoped to the owning account).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [trips]
                properties:
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip by id.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/content:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getTripContent
      tags: [trips]
      summary: Read the canonical trip content payload.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTripContent
      tags: [trips]
      summary: Mutate the trip content payload (validated against the schema).
      description: >
        Replaces the trip content with the supplied payload. The server validates
        against schemas/trip-content.schema.json before persisting; invalid
        payloads are rejected with 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripContent'
      responses:
        '200':
          description: Updated trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===== Use-our-AI surfaces (v0.3). Logged to ai_jobs; honour the daily cap. =====

  /trips/{tripId}/plan/chat:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: planChat
      tags: [trips]
      summary: Streaming use-our-AI planning chat (tier=ours).
      description: >
        Guarded Sonnet planning chat. Requires the trip tier to be `ours`; other
        tiers get 403. Each call writes an `ai_jobs` row and counts toward the
        per-trip daily cap (over the cap returns 429). The response is a
        `text/event-stream`: each `data:` frame is a `PlanChatEvent` JSON object
        and the stream ends with a literal `data: [DONE]`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChatRequest'
      responses:
        '200':
          description: Server-sent event stream of chat deltas.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  A sequence of SSE frames. Each `data:` line is a JSON
                  PlanChatEvent; the final frame is the literal `[DONE]`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trips/{tripId}/ingest:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: ingestToTrip
      tags: [trips]
      summary: Turn a receipt/photo/note into a validated patch on the trip content.
      description: >
        Vision-capable ingestion for paid trips (tier `byo` or `ours`; other
        tiers get 403). The harness produces a TripContentPatch which is applied
        to the current content, re-validated against the schema, and persisted.
        Each call writes an `ai_jobs` row and counts toward the per-trip daily
        cap (over the cap returns 429). Provide `text`, `image`, or both.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: The applied patch and the resulting trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ===== Admin-scoped surface (v0.2). All require role=admin + AAL2. =====

  /admin/prompts:
    get:
      operationId: listPrompts
      tags: [admin]
      summary: List prompts (latest per task, or all versions with ?task=).
      security:
        - adminAuth: []
      parameters:
        - { name: task, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of prompts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPrompt
      tags: [admin]
      summary: Create a new prompt for a task.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPrompt
      tags: [admin]
      summary: Get a single prompt version.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The prompt version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'

  /admin/prompts/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createPromptVersion
      tags: [admin]
      summary: Create a new (immutable) version of a prompt.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptVersionRequest'
      responses:
        '201':
          description: New version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: activatePrompt
      tags: [admin]
      summary: Activate a version for its task (deactivates the prior active one).
      security:
        - adminAuth: []
      responses:
        '200':
          description: Activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts/{id}/diff:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: diffPrompt
      tags: [admin]
      summary: Diff two versions of a prompt.
      security:
        - adminAuth: []
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: A unified diff between the two versions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to, diff]
                properties:
                  from: { type: integer }
                  to: { type: integer }
                  diff: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/models:
    get:
      operationId: listModels
      tags: [admin]
      summary: Available models and capabilities.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [model]
                      properties:
                        model: { $ref: '#/components/schemas/AiModel' }
                        vision: { type: boolean }
                        streaming: { type: boolean }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/model-routes:
    get:
      operationId: listModelRoutes
      tags: [admin]
      summary: Per-task default model and overrides.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Model routes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelRoute'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/model-routes/{task}:
    parameters:
      - { name: task, in: path, required: true, schema: { type: string } }
    put:
      operationId: setModelRoute
      tags: [admin]
      summary: Set the default model or override for a task.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelRouteRequest'
      responses:
        '200':
          description: Updated route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRoute'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/jobs:
    get:
      operationId: listJobs
      tags: [admin]
      summary: List AI jobs; filter by status, kind, trip.
      security:
        - adminAuth: []
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AiJobStatus' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/AiJobKind' } }
        - { name: tripId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJobPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getJob
      tags: [admin]
      summary: Job detail incl. model, prompt version used, and error.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'

  /admin/jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: retryJob
      tags: [admin]
      summary: Re-enqueue a failed job (writes a new ai_jobs row; cap enforced).
      security:
        - adminAuth: []
      responses:
        '202':
          description: Re-enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJob'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/jobs/cap:
    get:
      operationId: getJobCap
      tags: [admin]
      summary: Daily-cap usage for a trip (cap ~10/day).
      security:
        - adminAuth: []
      parameters:
        - { name: tripId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cap usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCapUsage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/trips:
    get:
      operationId: searchTrips
      tags: [admin]
      summary: Search trips by customer email, destination, or id.
      security:
        - adminAuth: []
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of trip summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummaryPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTripSummary
      tags: [admin]
      summary: Trip summary, tier, and retention.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Trip summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'

  /admin/trips/{id}/content:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getAdminTripContent
      tags: [admin]
      summary: Canonical trip_content for inspection.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripContent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'

  /admin/trips/{id}/profiles:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getAdminTripProfiles
      tags: [admin]
      summary: Child profiles for the trip.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Child profiles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminChildProfile'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/trips/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getAdminTripProgress
      tags: [admin]
      summary: Per-profile progress for the trip.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Per-profile progress.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminProgress'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers:
    get:
      operationId: searchCustomers
      tags: [admin]
      summary: Account lookup, entitlement, retention.
      security:
        - adminAuth: []
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of customer summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummaryPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{id}/deletion-request:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: requestCustomerDeletion
      tags: [admin]
      summary: Record or honour a data-deletion request.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Deletion request recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummary'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/content-review:
    get:
      operationId: listContentReview
      tags: [admin]
      summary: Generated content awaiting review.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of content-review items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReviewPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/content-review/{tripId}/approve:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveContent
      tags: [admin]
      summary: Approve generated content for publish.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReviewItem'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/content-review/{tripId}/edit:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string } }
    post:
      operationId: editContent
      tags: [admin]
      summary: Edit then publish (audited).
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripContent'
      responses:
        '200':
          description: Edited and published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReviewItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/products:
    get:
      operationId: listProducts
      tags: [admin]
      summary: Catalogue (price id, name, amount).
      security:
        - adminAuth: []
      responses:
        '200':
          description: Catalogue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/purchases:
    get:
      operationId: listPurchases
      tags: [admin]
      summary: Purchases and entitlement (from the Stripe webhook).
      security:
        - adminAuth: []
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of purchases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSummaryPage'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT. The database reads the JWT to enforce RLS.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase JWT with role=admin and AAL2 (verified MFA). The server rejects
        non-admin or non-MFA callers with 403. Every call is audited.

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
      description: Trip identifier.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a prior response's nextCursor.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
      description: Page size.

  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests, or the per-trip daily AI cap is reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EntitlementRequired:
      description: The trip's tier does not entitle the caller to this AI surface.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not an admin, or MFA (AAL2) not satisfied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemNotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable description.
            details:
              type: array
              items:
                type: string

    Tier:
      type: string
      enum: [free, byo, ours]
      description: How the trip was bought; drives entitlement and AI path.

    TripStatus:
      type: string
      enum: [draft, planning, ready, holidaying, complete, archived]

    Trip:
      type: object
      additionalProperties: false
      required: [id, destination, tier, status]
      properties:
        id:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string
        tier:
          $ref: '#/components/schemas/Tier'
        status:
          $ref: '#/components/schemas/TripStatus'
        retention_expires_at:
          type: string
          format: date-time
          description: When trip data is scheduled for disposal unless a keep-token extends it.
        created_at:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string

    DemoChildProfile:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
          minimum: 0
          maximum: 18
        mode:
          type: string
          enum: [little, explorer, explorer_plus]
          description: Kid explorer mode used to pick the variant block.
        interests:
          type: array
          items:
            type: string
        dietary:
          type: array
          items:
            type: string
          description: Dietary flags surfaced to adults as safety notes.

    DemoGenerateDayRequest:
      type: object
      additionalProperties: false
      required: [destination, child]
      properties:
        destination:
          type: string
          minLength: 1
        date:
          type: string
          format: date
          description: Optional day to theme the plan around.
        child:
          $ref: '#/components/schemas/DemoChildProfile'

    DemoGenerateDayResponse:
      type: object
      additionalProperties: false
      required: [day, grownups_teaser]
      properties:
        day:
          $ref: '#/components/schemas/Day'
        grownups_teaser:
          type: string
          description: A short teaser of the grown-ups guide.
        generated_by:
          type: string
          enum: [ai, fallback]
          description: Whether a live model produced this or the deterministic fallback did.

    SignupCaptureRequest:
      type: object
      additionalProperties: false
      required: [email, consent]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        source:
          type: string
          description: Funnel source, e.g. website-demo or fe-demo.
        consent:
          type: boolean
          description: Marketing consent state captured at signup.
        attributes:
          type: object
          additionalProperties: true
          description: Optional free-form attributes synced to Brevo.

    SignupCaptureResponse:
      type: object
      additionalProperties: false
      required: [contact_id, status]
      properties:
        contact_id:
          type: string
        status:
          type: string
          enum: [created, updated]
        synced_to_brevo:
          type: boolean

    TwoFactorVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 10

    TwoFactorVerifyResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean

    # ----- Canonical content model (mirrors schemas/trip-content.schema.json) -----
    TripContent:
      type: object
      additionalProperties: false
      required: [trip, days]
      properties:
        trip:
          $ref: '#/components/schemas/TripContentHeader'
        days:
          type: array
          items:
            $ref: '#/components/schemas/Day'
        grownups:
          $ref: '#/components/schemas/Grownups'

    TripContentHeader:
      type: object
      additionalProperties: false
      required: [id, destination, start_date, end_date]
      properties:
        id:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string

    Day:
      type: object
      additionalProperties: false
      required: [id, moments]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        label:
          type: string
        summary:
          type: string
        moments:
          type: array
          items:
            $ref: '#/components/schemas/Moment'

    Moment:
      type: object
      additionalProperties: false
      required: [id, slot, title, activities]
      properties:
        id:
          type: string
        slot:
          type: string
          enum: [morning, midday, afternoon, evening, night, anytime]
        title:
          type: string
        time_hint:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'

    Location:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        lat:
          type: number
        lng:
          type: number

    Activity:
      type: object
      additionalProperties: false
      required: [id, kind, title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [kid, shared, adult]
        title:
          type: string
        body:
          type: string
        variants:
          $ref: '#/components/schemas/Variants'
        booking:
          $ref: '#/components/schemas/Booking'
        safety:
          $ref: '#/components/schemas/Safety'
        media_ref:
          type: array
          items:
            type: string

    Variants:
      type: object
      additionalProperties: false
      properties:
        little:
          $ref: '#/components/schemas/VariantBlock'
        explorer:
          $ref: '#/components/schemas/VariantBlock'
        explorer_plus:
          $ref: '#/components/schemas/VariantBlock'

    VariantBlock:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
        fact:
          type: string
        quiz:
          $ref: '#/components/schemas/Quiz'

    Quiz:
      type: object
      additionalProperties: false
      required: [q, a]
      properties:
        q:
          type: string
        a:
          type: string
        options:
          type: array
          items:
            type: string

    Booking:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        time:
          type: string
        ref:
          type: string
        notes:
          type: string

    Safety:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
        flags:
          type: array
          items:
            type: string

    Grownups:
      type: object
      additionalProperties: false
      properties:
        essentials:
          type: string
        checklist:
          type: array
          items:
            type: string
        transport:
          type: string

    # ===== Use-our-AI schemas (v0.3) =====

    ActivityPatch:
      type: object
      additionalProperties: false
      description: A partial Activity for update_activity (id is immutable).
      properties:
        kind:
          type: string
          enum: [kid, shared, adult]
        title:
          type: string
        body:
          type: string
        variants:
          $ref: '#/components/schemas/Variants'
        booking:
          $ref: '#/components/schemas/Booking'
        safety:
          $ref: '#/components/schemas/Safety'
        media_ref:
          type: array
          items:
            type: string

    PatchOp:
      description: A single structured edit to the trip content.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, day]
          properties:
            op: { const: add_day }
            day: { $ref: '#/components/schemas/Day' }
        - type: object
          additionalProperties: false
          required: [op, day_id, summary]
          properties:
            op: { const: set_day_summary }
            day_id: { type: string }
            summary: { type: string }
        - type: object
          additionalProperties: false
          required: [op, day_id, moment]
          properties:
            op: { const: add_moment }
            day_id: { type: string }
            moment: { $ref: '#/components/schemas/Moment' }
        - type: object
          additionalProperties: false
          required: [op, day_id, moment_id, activity]
          properties:
            op: { const: add_activity }
            day_id: { type: string }
            moment_id: { type: string }
            activity: { $ref: '#/components/schemas/Activity' }
        - type: object
          additionalProperties: false
          required: [op, activity_id, set]
          properties:
            op: { const: update_activity }
            activity_id: { type: string }
            set: { $ref: '#/components/schemas/ActivityPatch' }
        - type: object
          additionalProperties: false
          required: [op, activity_id, to_moment_id]
          properties:
            op: { const: move_activity }
            activity_id: { type: string }
            to_moment_id: { type: string }
        - type: object
          additionalProperties: false
          required: [op, activity_id, booking]
          properties:
            op: { const: set_booking }
            activity_id: { type: string }
            booking: { $ref: '#/components/schemas/Booking' }

    TripContentPatch:
      type: object
      additionalProperties: false
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PatchOp'
        note:
          type: string
          description: Short human-readable note on what changed.

    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    PlanChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'

    PlanChatEvent:
      description: >
        One frame of the chat SSE stream (the JSON in a `data:` line). The stream
        also emits a literal `data: [DONE]` terminator.
      oneOf:
        - type: object
          additionalProperties: false
          required: [start, generated_by]
          properties:
            start: { const: true }
            generated_by: { type: string, enum: [ai, fallback] }
        - type: object
          additionalProperties: false
          required: [delta]
          properties:
            delta: { type: string }
        - type: object
          additionalProperties: false
          required: [done]
          properties:
            done: { const: true }
            job_id: { type: [string, 'null'] }
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error: { type: string }

    IngestImage:
      type: object
      additionalProperties: false
      required: [media_type, data]
      properties:
        media_type:
          type: string
          description: e.g. image/jpeg, image/png.
        data:
          type: string
          description: 'base64-encoded image bytes (no data: prefix).'

    IngestRequest:
      type: object
      additionalProperties: false
      description: Provide text, image, or both.
      properties:
        text:
          type: string
        image:
          $ref: '#/components/schemas/IngestImage'
        hint:
          type: object
          additionalProperties: false
          properties:
            day_id: { type: string }
            moment_id: { type: string }

    IngestResponse:
      type: object
      additionalProperties: false
      required: [applied, job_id, generated_by, patch, content]
      properties:
        applied:
          type: boolean
        job_id:
          type: [string, 'null']
          description: The ai_jobs ledger id (counts to the daily cap).
        generated_by:
          type: string
          enum: [ai, fallback]
        patch:
          $ref: '#/components/schemas/TripContentPatch'
        content:
          $ref: '#/components/schemas/TripContent'

    # ===== Admin-scoped schemas (v0.2) =====
    Problem:
      type: object
      description: RFC 9457 problem+json.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    AiModel:
      type: string
      enum: [claude-sonnet, claude-opus, gemini, openai]

    AiJobKind:
      type: string
      enum: [generation, ingestion, chat]

    AiJobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    Prompt:
      type: object
      additionalProperties: false
      required: [id, task, title, body, model, version, active, updatedAt, updatedBy]
      properties:
        id: { type: string }
        task: { type: string }
        title: { type: string }
        body: { type: string }
        model: { $ref: '#/components/schemas/AiModel' }
        version: { type: integer }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    CreatePromptRequest:
      type: object
      additionalProperties: false
      required: [task, title, body, model]
      properties:
        task: { type: string }
        title: { type: string }
        body: { type: string }
        model: { $ref: '#/components/schemas/AiModel' }

    CreatePromptVersionRequest:
      type: object
      additionalProperties: false
      required: [title, body, model]
      properties:
        title: { type: string }
        body: { type: string }
        model: { $ref: '#/components/schemas/AiModel' }

    ModelRoute:
      type: object
      additionalProperties: false
      required: [task, defaultModel]
      properties:
        task: { type: string }
        defaultModel: { $ref: '#/components/schemas/AiModel' }
        override: { $ref: '#/components/schemas/AiModel' }

    SetModelRouteRequest:
      type: object
      additionalProperties: false
      required: [defaultModel]
      properties:
        defaultModel: { $ref: '#/components/schemas/AiModel' }
        override:
          oneOf:
            - { $ref: '#/components/schemas/AiModel' }
            - { type: 'null' }

    AiJob:
      type: object
      additionalProperties: false
      required: [id, tripId, kind, status, model, promptVersion, createdAt]
      properties:
        id: { type: string }
        tripId: { type: string }
        kind: { $ref: '#/components/schemas/AiJobKind' }
        status: { $ref: '#/components/schemas/AiJobStatus' }
        model: { $ref: '#/components/schemas/AiModel' }
        promptVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        error: { type: string }

    JobCapUsage:
      type: object
      additionalProperties: false
      required: [tripId, date, used, limit, remaining]
      properties:
        tripId: { type: string }
        date: { type: string, format: date }
        used: { type: integer }
        limit: { type: integer }
        remaining: { type: integer }

    TripSummary:
      type: object
      additionalProperties: false
      required: [id, destination, ownerEmail, tier, status, startDate, endDate, retentionExpiresAt]
      properties:
        id: { type: string }
        destination: { type: string }
        ownerEmail: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        status: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        retentionExpiresAt:
          type: [string, 'null']
          format: date-time

    AdminChildProfile:
      type: object
      additionalProperties: false
      required: [id, name, interests]
      properties:
        id: { type: string }
        name: { type: string }
        age: { type: integer }
        mode:
          type: string
          enum: [little, explorer, explorer_plus]
        interests:
          type: array
          items: { type: string }

    AdminProgress:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId: { type: [string, 'null'] }
        activeMode:
          type: [string, 'null']
        doneItems:
          type: array
          items: { type: string }

    CustomerSummary:
      type: object
      additionalProperties: false
      required: [userId, email, tier, retentionExpiresAt, deletionRequested]
      properties:
        userId: { type: string }
        email: { type: string }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/Tier' }
            - { type: 'null' }
        retentionExpiresAt:
          type: [string, 'null']
          format: date-time
        deletionRequested: { type: boolean }

    ProductSummary:
      type: object
      additionalProperties: false
      required: [priceId, name, amountUsd]
      properties:
        priceId: { type: string }
        name: { type: string }
        amountUsd: { type: number }

    PurchaseSummary:
      type: object
      additionalProperties: false
      required: [id, ownerEmail, priceId, tier, amountUsd, createdAt]
      properties:
        id: { type: string }
        ownerEmail: { type: string }
        priceId: { type: string }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/Tier' }
            - { type: 'null' }
        amountUsd: { type: number }
        createdAt: { type: string, format: date-time }

    ContentReviewItem:
      type: object
      additionalProperties: false
      required: [tripId, destination, status, generatedAt, reviewedAt, reviewedBy]
      properties:
        tripId: { type: string }
        destination: { type: string }
        status:
          type: string
          enum: [pending, approved, edited]
        generatedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'] }

    # ----- Pagination envelopes -----
    PromptPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Prompt' }
        nextCursor: { type: [string, 'null'] }

    AiJobPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiJob' }
        nextCursor: { type: [string, 'null'] }

    TripSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TripSummary' }
        nextCursor: { type: [string, 'null'] }

    CustomerSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSummary' }
        nextCursor: { type: [string, 'null'] }

    ContentReviewPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentReviewItem' }
        nextCursor: { type: [string, 'null'] }

    PurchaseSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseSummary' }
        nextCursor: { type: [string, 'null'] }
