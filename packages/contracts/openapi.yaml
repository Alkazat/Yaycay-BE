openapi: 3.1.0
info:
  title: Yaycay API
  version: 0.17.1
  description: >
    Yaycay back-end HTTP API. The v0.1 surface (Phase 0) is the free-demo
    generator, signup/lead capture, the 2FA verify step, and trip + trip-content
    read/mutate. v0.2 adds the admin-scoped `/admin/*` surface (prompts, models,
    jobs, trips/customers, content review, commerce). v0.3 adds the use-our-AI
    surfaces: a streaming planning chat and structured ingestion (a receipt,
    booking, or note becomes a validated patch on the trip content). BE owns this
    contract; FE, Admin and Website are clients and never call an endpoint or
    read a field that is not defined here.
  contact:
    name: Yaycay Back-End
    url: https://github.com/Alkazat/Yaycay-BE
servers:
  - url: https://api.yaycay.ai
    description: Production
  - url: https://staging.api.yaycay.ai
    description: Staging
tags:
  - name: demo
    description: Free-demo hook (public, rate-limited).
  - name: signup
    description: Lead capture and Brevo sync.
  - name: auth
    description: Authentication helpers (2FA on every sign-in).
  - name: account
    description: The signed-in owner's own account (read + recovery-email update).
  - name: trips
    description: Trip CRUD and the canonical trip content payload.
  - name: commerce
    description: Stripe Checkout and the entitlement webhook.
  - name: admin
    description: >
      Admin-scoped, off-domain surface. Every endpoint requires a Supabase JWT
      with role=admin and AAL2 (verified MFA); non-admin or non-MFA callers get
      403. Every call is audited server-side. Errors are RFC 9457 problem+json.

paths:
  /demo/generate-day:
    post:
      operationId: generateDemoDay
      tags: [demo]
      summary: Generate one AI-built day for the free demo.
      description: >
        The hook. Produces a single day for one person with one quiz and a teaser
        of the grown-ups guide. The single AI action is never advertised; it is
        just how the demo generates. Public and rate-limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoGenerateDayRequest'
      responses:
        '200':
          description: A generated demo day plus a grown-ups teaser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoGenerateDayResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /signup/capture:
    post:
      operationId: captureSignup
      tags: [signup]
      summary: Create or update a lead and sync to Brevo.
      description: >
        Used by the Website funnel and the FE demo. Upserts a marketing_contacts
        row with consent state and syncs to Brevo. Idempotent on email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCaptureRequest'
      responses:
        '200':
          description: Lead captured (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCaptureResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      tags: [auth]
      summary: Verify the one-time email 2FA code.
      description: >
        Second factor required on every sign-in. Verifies the one-time code sent
        to the account email; on success the session is fully established.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: Code verified; session elevated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List the caller's trips.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's trips (RLS scoped to the owning account).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [trips]
                properties:
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/TripSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip's canonical content by id.
      description: >
        Returns the trip's `TripContent` (the schema-owned payload of §5). Trip
        metadata (tier, status, retention) is carried on the `TripSummary` from
        `GET /trips`; mutate the content via `PATCH /trips/{tripId}/content`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/content:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getTripContent
      tags: [trips]
      summary: Read the canonical trip content payload.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTripContent
      tags: [trips]
      summary: Mutate the trip content payload (validated against the schema).
      description: >
        Replaces the trip content with the supplied payload. The server validates
        against schemas/trip-content.schema.json before persisting; invalid
        payloads are rejected with 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripContent'
      responses:
        '200':
          description: Updated trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===== Use-our-AI surfaces (v0.3). Logged to ai_jobs; honour the daily cap. =====

  /trips/{tripId}/plan/chat:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: planChat
      tags: [trips]
      summary: Streaming use-our-AI planning chat (tier=ours).
      description: >
        Guarded Sonnet planning chat. Requires the trip tier to be `ours`; other
        tiers get 403. Each call writes an `ai_jobs` row and counts toward the
        per-trip daily cap (over the cap returns 429). The response is a
        `text/event-stream`: each `data:` frame is a `PlanChatEvent` JSON object
        and the stream ends with a literal `data: [DONE]`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChatRequest'
      responses:
        '200':
          description: Server-sent event stream of chat deltas.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  A sequence of SSE frames. Each `data:` line is a JSON
                  PlanChatEvent; the final frame is the literal `[DONE]`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trips/{tripId}/ingest:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      operationId: ingestToTrip
      tags: [trips]
      summary: Turn a receipt/photo/note into a validated patch on the trip content.
      description: >
        Vision-capable ingestion for paid trips (tier `byo` or `ours`; other
        tiers get 403). The harness produces a TripContentPatch which is applied
        to the current content, re-validated against the schema, and persisted.
        Each call writes an `ai_jobs` row and counts toward the per-trip daily
        cap (over the cap returns 429). Provide `text`, `image`, or both.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: The applied patch and the resulting trip content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ===== Journal + media (v0.6) =====

  /trips/{tripId}/journal:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: listJournal
      tags: [trips]
      summary: List the trip's journal entries (optionally by profile).
      security:
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The journal entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createJournalEntry
      tags: [trips]
      summary: 'Add a journal entry (paid: byo or ours).'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryInput'
      responses:
        '201':
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /media/sign-upload:
    post:
      operationId: signMediaUpload
      tags: [trips]
      summary: 'Mint a signed upload URL for trip media (paid: byo or ours).'
      description: >
        Returns a short-lived signed URL to PUT a file straight to private
        Storage, plus a `media_ref` to store in journal entries / trip content.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUploadRequest'
      responses:
        '200':
          description: The signed upload URL and media reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===== Account (v0.17) =====

  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Read the signed-in owner's account.
      description: >
        Returns the caller's own account row (the parent/owner, distinct from the
        per-child profiles). Email and role are server-owned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAccount
      tags: [account]
      summary: Update the caller's recovery email.
      description: >
        The only consumer-mutable account field is the recovery email. Send
        `recoveryEmail: null` to clear it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===== BYO-AI MCP (v0.6) =====

  /connectors/byo-ai:
    post:
      operationId: createByoConnector
      tags: [trips]
      summary: 'Mint a scoped MCP connector token for a trip (tier=byo).'
      description: >
        Creates a connector scoped to one trip and returns a token the parent adds
        to their own ChatGPT / Claude / Gemini as an MCP connector. Entitlement
        is set only by the signed webhook; this requires the trip to be on the byo
        tier.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByoConnectorRequest'
      responses:
        '201':
          description: The connector token and MCP endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ByoConnectorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /connectors:
    get:
      operationId: listConnectors
      tags: [trips]
      summary: List the caller's BYO-AI connectors and their status.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's connectors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connectors/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: revokeConnector
      tags: [trips]
      summary: Revoke a connector.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The connector was revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [revoked] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /mcp:
    post:
      operationId: mcpEndpoint
      tags: [trips]
      summary: Authenticated MCP endpoint (JSON-RPC) for BYO-AI connectors.
      description: >
        A JSON-RPC 2.0 endpoint authenticated by a connector token (Authorization:
        Bearer). Implements MCP `initialize`, `tools/list`, and `tools/call`. Tools
        (get_trip, list_days, add_moment, add_activity, update_activity,
        move_activity, set_packing_list, import_reservation, optimise_day) are
        scoped to the connector's trip; writes are schema-validated. No model is
        invoked here. The body and result follow the JSON-RPC / MCP wire format.
      security:
        - mcpAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request (MCP method + params).
      responses:
        '200':
          description: A JSON-RPC 2.0 response.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid connector token.
          content:
            application/json:
              schema:
                type: object

  # ===== Commerce (v0.5): Stripe Checkout + webhook =====

  /checkout/session:
    post:
      operationId: createCheckoutSession
      tags: [commerce]
      summary: Create a Stripe Checkout Session for a catalogue price.
      description: >
        Creates a Stripe Checkout Session for a known, active product price. The
        purchased tier is carried in the session metadata; the trip tier is only
        flipped by the signed `/webhooks/stripe` event, never here, so
        entitlement cannot be spoofed from the client. Returns 503 when payments
        are not configured.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '200':
          description: The hosted Checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          description: Unknown or inactive price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Payments are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [commerce]
      summary: Stripe event sink (signature-verified; sets entitlement).
      description: >
        Stripe calls this directly (no JWT). The body is verified against the
        `Stripe-Signature` header; on `checkout.session.completed` the purchase
        is recorded and the trip tier is flipped. Idempotent on the Stripe
        session id, so redelivered events are no-ops.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A raw Stripe event; verified by signature, not by schema.
      responses:
        '200':
          description: Event received.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [received]
                properties:
                  received:
                    type: boolean
        '400':
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Admin-scoped surface (v0.2). All require role=admin + AAL2. =====

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: The resolved admin session (role + MFA), for a client-side gate.
      description: >
        Echoes the caller's admin session after the server proves role=admin +
        AAL2. Lets the Admin app render its dashboard without probing a 403.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The resolved admin session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts:
    get:
      operationId: listPrompts
      tags: [admin]
      summary: List prompts (latest per task, or all versions with ?task=).
      security:
        - adminAuth: []
      parameters:
        - { name: task, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of prompts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPrompt
      tags: [admin]
      summary: Create a new prompt for a task.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPrompt
      tags: [admin]
      summary: Get a single prompt version.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The prompt version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'

  /admin/prompts/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createPromptVersion
      tags: [admin]
      summary: Create a new (immutable) version of a prompt.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptVersionRequest'
      responses:
        '201':
          description: New version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: activatePrompt
      tags: [admin]
      summary: Activate a version for its task (deactivates the prior active one).
      security:
        - adminAuth: []
      responses:
        '200':
          description: Activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prompts/{id}/diff:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: diffPrompt
      tags: [admin]
      summary: Diff two versions of a prompt.
      security:
        - adminAuth: []
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: A unified diff between the two versions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to, diff]
                properties:
                  from: { type: integer }
                  to: { type: integer }
                  diff: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/models:
    get:
      operationId: listModels
      tags: [admin]
      summary: Available models and capabilities.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [model]
                      properties:
                        model: { $ref: '#/components/schemas/AiModel' }
                        vision: { type: boolean }
                        streaming: { type: boolean }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/model-routes:
    get:
      operationId: listModelRoutes
      tags: [admin]
      summary: Per-task default model and overrides.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Model routes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelRoute'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/model-routes/{task}:
    parameters:
      - { name: task, in: path, required: true, schema: { type: string } }
    put:
      operationId: setModelRoute
