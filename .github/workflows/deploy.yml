name: Deploy

# Deploys the backend (migrations + edge functions) to a Supabase project.
#
# Manual by default (workflow_dispatch) so a deploy is always a deliberate act;
# the project ref defaults to the current target. Requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN  - account access token (Dashboard -> Account -> Access Tokens)
#   SUPABASE_DB_PASSWORD   - the project's database password (for `db push`)
# Optional function secrets, pushed to the project when present:
#   ANTHROPIC_API_KEY      - enables live AI (chat/ingest/demo); without it the
#                            harness uses its deterministic fallback
#   BREVO_API_KEY          - enables marketing-contact sync on signup
# Note: SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are injected
# into edge functions by the platform; they are not set here.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref to deploy to'
        required: true
        default: 'nzmjkbjtcjthjwdscjrj'
      push_migrations:
        description: 'Run `supabase db push` (apply migrations)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ github.event.inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity-check required secrets
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN repo secret is not set." >&2; exit 1
          fi

      - name: Link the project
        run: supabase link --project-ref "${PROJECT_REF}"

      - name: Push migrations
        if: ${{ github.event.inputs.push_migrations == 'true' }}
        run: supabase db push

      - name: Set function secrets (only those provided)
        run: |
          set --
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] && set -- "$@" "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
          [ -n "${{ secrets.BREVO_API_KEY }}" ] && set -- "$@" "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}"
          if [ "$#" -gt 0 ]; then
            supabase secrets set --project-ref "${PROJECT_REF}" "$@"
          else
            echo "No optional function secrets provided; skipping."
          fi

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "${PROJECT_REF}"
