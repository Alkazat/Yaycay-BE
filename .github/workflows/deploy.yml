name: Deploy

# Deploys the backend (migrations + edge functions) to Supabase.
#
# Environments map to branches:
#   push to develop -> staging  (STAGING_PROJECT_REF / STAGING_DB_PASSWORD)
#   push to main    -> production (SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD)
# A manual run (workflow_dispatch) can target either, regardless of branch.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN  - account access token (Dashboard -> Account -> Access Tokens)
#   SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD     - production project
#   STAGING_PROJECT_REF  / STAGING_DB_PASSWORD      - staging project
# Optional function secrets, pushed to the target project when present:
#   ANTHROPIC_API_KEY  - enables live AI; without it the harness falls back
#   BREVO_API_KEY      - enables marketing-contact sync on signup
#   Stripe (per environment): production uses STRIPE_SECRET_KEY /
#     STRIPE_WEBHOOK_SECRET (live keys); staging uses STAGING_STRIPE_SECRET_KEY /
#     STAGING_STRIPE_WEBHOOK_SECRET (test keys). Whichever is set is pushed to the
#     project as STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET for the functions.
#   MCP_TOKEN_SIGNING_SECRET - signs BYO-AI connector tokens (any strong random
#     string); without it the MCP endpoint and connector minting return an error.
#   DISPOSAL_SECRET - shared secret guarding the /disposal sweep endpoint (any
#     strong random string); without it the endpoint reports disabled.
# Note: SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are injected
# into edge functions by the platform; they are not set here.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        options: [staging, production]
        default: staging
      push_migrations:
        description: 'Run `supabase db push` (apply migrations)'
        type: boolean
        default: true

permissions:
  contents: read

# One deploy per environment at a time; never cancel a prod deploy mid-flight.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target environment + project
        id: target
        env:
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN repo secret is not set." >&2; exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi

          if [ "${ENVIRONMENT}" = "production" ]; then
            REF="${PROD_PROJECT_REF}"; PW="${PROD_DB_PASSWORD}"
          else
            REF="${STAGING_PROJECT_REF}"; PW="${STAGING_DB_PASSWORD}"
          fi
          if [ -z "${REF}" ]; then
            echo "Missing project ref secret for ${ENVIRONMENT}." >&2; exit 1
          fi

          echo "::add-mask::${PW}"
          echo "PROJECT_REF=${REF}" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=${PW}" >> "$GITHUB_ENV"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "Deploying to ${ENVIRONMENT} (${REF})"

      - name: Link the project
        run: supabase link --project-ref "${PROJECT_REF}"

      - name: Push migrations
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_migrations == 'true' }}
        run: supabase db push

      - name: Set function secrets (only those provided)
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # Stripe is per environment: live keys on production, test keys on staging.
          PROD_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PROD_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          MCP_TOKEN_SIGNING_SECRET: ${{ secrets.MCP_TOKEN_SIGNING_SECRET }}
          DISPOSAL_SECRET: ${{ secrets.DISPOSAL_SECRET }}
        run: |
          if [ "${ENVIRONMENT}" = "production" ]; then
            STRIPE_KEY="${PROD_STRIPE_SECRET_KEY}"; STRIPE_WH="${PROD_STRIPE_WEBHOOK_SECRET}"
          else
            STRIPE_KEY="${STAGING_STRIPE_SECRET_KEY}"; STRIPE_WH="${STAGING_STRIPE_WEBHOOK_SECRET}"
          fi
          set --
          [ -n "${ANTHROPIC_API_KEY}" ] && set -- "$@" "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
          [ -n "${BREVO_API_KEY}" ] && set -- "$@" "BREVO_API_KEY=${BREVO_API_KEY}"
          [ -n "${STRIPE_KEY}" ] && set -- "$@" "STRIPE_SECRET_KEY=${STRIPE_KEY}"
          [ -n "${STRIPE_WH}" ] && set -- "$@" "STRIPE_WEBHOOK_SECRET=${STRIPE_WH}"
          [ -n "${MCP_TOKEN_SIGNING_SECRET}" ] && set -- "$@" "MCP_TOKEN_SIGNING_SECRET=${MCP_TOKEN_SIGNING_SECRET}"
          [ -n "${DISPOSAL_SECRET}" ] && set -- "$@" "DISPOSAL_SECRET=${DISPOSAL_SECRET}"
          if [ "$#" -gt 0 ]; then
            supabase secrets set --project-ref "${PROJECT_REF}" "$@"
          else
            echo "No optional function secrets provided; skipping."
          fi

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "${PROJECT_REF}"

      - name: Summary
        run: echo "Deployed ${{ steps.target.outputs.environment }} -> ${PROJECT_REF}" >> "$GITHUB_STEP_SUMMARY"
