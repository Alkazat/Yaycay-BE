name: Reconcile staging migration 0031

# One-shot, MANUAL-ONLY operational fix for STAGING.
#
# Background: two parallel sessions both numbered a migration `0031`.
# `0031_trip_profile_features` was direct-pushed to main/prod, while
# `0031_account_retention` reached develop/staging. Staging therefore recorded
# version `0031` against account_retention and SKIPPED the trip_profile_features
# body, so `public.trip_profile_features` does NOT exist on staging even though
# develop/prod now carry it (account_retention was renumbered to `0032`).
#
# This workflow, on staging only:
#   1. marks `0031` as reverted in staging's migration history,
#   2. re-applies it with `--include-all` (0031 is older than the applied 0032),
#   3. VERIFIES the real table exists via the Supabase Management API and FAILS
#      the job if it does not (never trusts the history table alone).
#
# PROD IS NEVER TOUCHED: only the STAGING_* secrets are used, the job refuses to
# run if the staging ref is missing or equal to the production ref, and there is
# no push trigger — it runs only when manually dispatched with a typed confirm.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reconcile-staging-0031" to confirm (staging only).'
        type: string
        required: true
      migration_version:
        description: 'Migration version to repair+reapply.'
        type: string
        default: '0031'

permissions:
  contents: read

concurrency:
  # Share the staging deploy lane so this never races a staging deploy.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERSION: ${{ github.event.inputs.migration_version }}
    steps:
      - name: Guard - typed confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "reconcile-staging-0031" ]; then
            echo "Confirmation phrase did not match. Aborting." >&2
            exit 1
          fi
          case "${VERSION}" in
            ''|*[!0-9]*) echo "migration_version must be numeric (e.g. 0031)." >&2; exit 1 ;;
          esac

      - name: Guard - staging creds present and NOT production
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set." >&2; exit 1
          fi
          if [ -z "${STAGING_PROJECT_REF}" ]; then
            echo "STAGING_PROJECT_REF is not set." >&2; exit 1
          fi
          if [ -n "${PROD_PROJECT_REF}" ] && [ "${STAGING_PROJECT_REF}" = "${PROD_PROJECT_REF}" ]; then
            echo "STAGING_PROJECT_REF equals the production ref. Refusing to run." >&2; exit 1
          fi
          echo "Target staging project: ${STAGING_PROJECT_REF}"

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: supabase link --project-ref "${STAGING_PROJECT_REF}"

      - name: Show migration history (before)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: supabase migration list

      - name: Repair - mark version reverted on staging
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: supabase migration repair --status reverted "${VERSION}"

      - name: Re-apply migrations (include-all)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: supabase db push --include-all

      - name: Show migration history (after)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: supabase migration list

      - name: Verify trip_profile_features actually exists (Management API)
        run: python3 .github/scripts/verify_trip_profile_features.py

      - name: Summary
        run: |
          {
            echo "## Staging migration ${VERSION} reconciled"
            echo "- Repaired \`${VERSION}\` (reverted) and re-applied with \`--include-all\`."
            echo "- Verified \`public.trip_profile_features\` exists via the Management API."
            echo "- Production was not touched."
          } >> "$GITHUB_STEP_SUMMARY"
