name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Contract, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Validate the contract (OpenAPI + JSON schema)
        run: npm run contracts:validate
      - name: Build packages
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  deno:
    name: Edge functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        working-directory: supabase/functions
        run: deno check demo-generate-day/index.ts signup-capture/index.ts admin/index.ts trips/index.ts auth-2fa-verify/index.ts checkout/index.ts stripe-webhook/index.ts media-sign-upload/index.ts mcp/index.ts connectors/index.ts disposal/index.ts profiles/index.ts account/index.ts catalogue/index.ts shared/index.ts ../seed/walker-demo.ts
      - name: Unit-test the shared edge logic
        working-directory: supabase/functions
        run: deno test --allow-env _shared/trip-patch_test.ts _shared/stripe_test.ts _shared/mcp-token_test.ts _shared/trip-intent_test.ts

  database:
    name: Migrations + RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Run pgTAP RLS isolation tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop
